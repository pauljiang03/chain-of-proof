<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- CONAN-F mark. Original artwork drawn for this project: an anime-style detective in
       silhouette, with a magnifying glass showing a check for findings that have been checked.
       It is an original character and does not copy any existing one. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f9df5"/>
      <stop offset="1" stop-color="#173f9e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe3ff"/>
    </radialGradient>
    <clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <circle cx="512" cy="470" r="420" fill="url(#glow)"/>
    <g transform="rotate(-6 512 640) translate(-22 10)" fill="#0c1a3d">
      <!-- coat with a raised collar -->
      <path d="M 462 730 L 462 806 Q 418 786 372 730 Q 356 800 330 852 Q 262 876 222 950 L 190 1110 L 834 1110 L 802 950
        Q 762 876 694 852 Q 668 800 652 730 Q 606 786 562 806 L 562 730 Z"/>
      <!-- head and hair -->
      <path d="M 308 516 Q 272 526 242 505 Q 280 469 291 417 Q 243 398 216 355 Q 273 355 320 325 Q 291 263 294 196 Q 336 237 394 251 Q 407 185 449 132 Q 452 182 485 220 Q 544 151 623 108 Q 590 165 588 231 Q 670 204 756 210 Q 703 234 672 283 Q 746 296 809 338 Q 761 341 725 373 Q 772 422 790 487 Q 748 486 716 516 Q 750 568 738 638 Q 698 612 690 592 Q 676 664 604 714 Q 556 748 512 750 Q 468 748 420 714 Q 348 664 334 592 Q 326 612 286 638 Q 274 568 308 516 Z"/>
      <!-- shirt and tie -->
      <path d="M 474 806 L 512 872 L 550 806 Z" fill="#eaf3ff"/>
      <path d="M 500 810 L 524 810 L 519 830 L 530 868 L 512 888 L 494 868 L 505 830 Z"/>
      <!-- large shining glasses -->
      <ellipse cx="426" cy="560" rx="74" ry="66" fill="#ffffff"/>
      <ellipse cx="598" cy="560" rx="74" ry="66" fill="#ffffff"/>
      <path d="M 528 676 Q 560 694 592 668" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    </g>
    <!-- magnifying glass showing a check -->
    <path d="M 868 898 L 922 952" fill="none" stroke="#0c1a3d" stroke-width="78" stroke-linecap="round"/>
    <circle cx="790" cy="820" r="136" fill="#0c1a3d"/>
    <path d="M 868 898 L 922 952" fill="none" stroke="#f4f8ff" stroke-width="46" stroke-linecap="round"/>
    <circle cx="790" cy="820" r="116" fill="#f4f8ff"/>
    <circle cx="790" cy="820" r="90" fill="#2fbf71"/>
    <path d="M 748 822 l 30 31 l 55 -64" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
